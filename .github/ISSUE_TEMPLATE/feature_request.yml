name: Feature request
description: Suggest a focused improvement to this fixed-schema demonstration.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe who needs the change and what they cannot do today. Use fictional examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected inputs, outputs, and source-preservation behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
