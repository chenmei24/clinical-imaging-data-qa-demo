name: Bug report
description: Report a reproducible audit or data-preservation problem using fictional data.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Use a minimal fictional CSV. Do not upload patient-identifiable or confidential data.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
      placeholder: Windows 11, Python 3.13
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and fictional input
      description: Paste the exact command and a small CSV that reproduces the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error
      description: Include the message and whether the source or previous outputs changed.
    validations:
      required: true
